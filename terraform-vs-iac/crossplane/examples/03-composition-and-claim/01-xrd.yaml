# Lesson 03 — step 1
# Terraform analog: variable blocks in modules/pet — what callers MAY set.

apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: storagebuckets.example.io
spec:
  group: example.io
  names:
    kind: StorageBucket
    plural: storagebuckets
  claimNames:
    kind: StorageBucketClaim
    plural: storagebucketclaims
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                  description: AWS region for the bucket
                purpose:
                  type: string
                  enum: [logs, backups]
                  description: Platform tagging policy input
              required: [region, purpose]
