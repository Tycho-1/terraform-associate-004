# Lesson 05 — step 1
# Terraform analog:
#
#   output "db_endpoint" {
#     value     = aws_db_instance.app.endpoint
#     sensitive = true
#   }
#
# Crossplane: provider writes connection info to a Secret the app team can mount.

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgres-with-connection-secret
spec:
  compositeTypeRef:
    apiVersion: example.io/v1alpha1
    kind: StorageBucket   # placeholder; real platform uses a Database XR
  mode: Resources
  resources:
    - name: database
      base:
        # Illustrative — use your provider's RDS (or other) MR kind in real configs
        apiVersion: rds.aws.upbound.io/v1beta1
        kind: Instance
        spec:
          forProvider:
            instanceClass: db.t3.micro
          writeConnectionSecretToRef:
            name: orders-db-connection
            namespace: team-orders
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.namespace
          toFieldPath: spec.writeConnectionSecretToRef.namespace
