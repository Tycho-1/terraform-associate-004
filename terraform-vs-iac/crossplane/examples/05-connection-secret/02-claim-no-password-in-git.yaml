# Lesson 05 — step 2
# Terraform analog: TF_VAR_db_password from CI, not committed — or write-only password_wo
#
# BAD in Git:
#   spec:
#     password: hunter2
#
# OK in Git — reference a Secret the team created via ESO / kubectl:

apiVersion: v1
kind: Secret
metadata:
  name: orders-db-admin
  namespace: team-orders
type: Opaque
stringData:
  # In real GitOps use SealedSecrets/SOPS/ESO — this inline form is for local learning only.
  username: admin
  password: REPLACE_VIA_ESO_NOT_GIT

---
# Claim might reference secret for optional user-supplied creds (provider-specific fields):
apiVersion: example.io/v1alpha1
kind: StorageBucketClaim
metadata:
  name: placeholder-claim
  namespace: team-orders
spec:
  compositionSelector:
    matchLabels:
      purpose: storage
  region: eu-central-1
  purpose: logs
