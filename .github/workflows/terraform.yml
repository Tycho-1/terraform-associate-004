name: Terraform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - labs/local-stack
          - 02-fundamentals/02a-provider-versions
          - 02-fundamentals/02c-multiple-providers
          - 03-core-workflow/lab
          - 04-configuration/04a-resources-and-data
          - 04-configuration/04b-references
          - 04-configuration/04c-variables-and-outputs
          - 04-configuration/04d-complex-types
          - 04-configuration/04e-expressions-and-functions
          - 04-configuration/04f-dependencies-and-lifecycle
          - 04-configuration/04g-custom-conditions
          - 04-configuration/04h-sensitive-data
          - 05-modules/05c-use-modules
          - 06-state/06a-local-backend
          - 06-state/06d-drift-and-refactor
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -input=false
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate
